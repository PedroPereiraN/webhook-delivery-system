services:
  api:
    build:
      context: .
      dockerfile: build/package/Dockerfile.api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webhook-delivery-system-network

  worker:
    build:
      context: .
      dockerfile: build/package/Dockerfile.worker
    environment:
      WEBHOOK_URL: http://email-mock:8081/webhook
      # Dev only. Must match the email-mock's secret.
      WEBHOOK_SECRET: dev-webhook-secret
    depends_on:
      postgres:
        condition: service_healthy
      email-mock:
        condition: service_started
    networks:
      - webhook-delivery-system-network
    deploy:
      replicas: 3

  # Simulated external email service, the destination of the worker's webhooks.
  email-mock:
    build:
      context: .
      dockerfile: build/package/Dockerfile.email-mock
    ports:
      - "8081:8081"
    environment:
      FAILURE_RATE: "0.3"
      SLOW_RATE: "0.1"
      SLOW_DELAY: "15s"
      WEBHOOK_SECRET: dev-webhook-secret
    networks:
      - webhook-delivery-system-network

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: db
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - webhook-delivery-system-network
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      # Read from .env; the defaults apply when the variable is not set.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@email.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin@123}
    networks:
      - webhook-delivery-system-network

volumes:
  pgdata:

networks:
  webhook-delivery-system-network:
    driver: bridge
